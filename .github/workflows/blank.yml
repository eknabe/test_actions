# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    # Triggers the workflow on push for the "main" branch or version tags
    branches:
      - '**'
    tags:
      - '**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      matrix:
        os: [macos-14]

    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}  # Use the matrix variable for the OS

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: clone esmini
        run: |
          git clone --branch traffic_lights_sq --depth 1 https://github.com/eknabe/esmini_fork esmini

      - name: build OSG
        run: |
          mkdir osg
          cd osg
          ../esmini/scripts/generate_osg_libs.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: osg_mac.7z
          path: osg_mac.7z

      - name: Debugging with tmate
        uses: mxschmitt/action-tmate@v3
