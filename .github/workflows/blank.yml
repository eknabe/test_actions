# Build OpenSceneGraph (OSG) libraries for esmini on supported platforms

name: CI

on:
  push:
    # Triggers the workflow on push for the "main" branch or version tags
    branches:
      - '**'
    tags:
      - '**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]

    runs-on: ${{ matrix.os }}  # Use the matrix variable for the OS

    steps:
      # Checks-out your repository in case we need it for debugging
      - uses: actions/checkout@v3

      - name: clone esmini
        run: |
          git clone --branch traffic_lights_sq --depth 1 https://github.com/eknabe/esmini_fork esmini

      - name: build OSG
        run: |
          mkdir osg
          cd osg
          ../esmini/scripts/generate_osg_libs.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: osg lib package
          path: osg/osg_*.7z

      - name: Debugging with tmate
        uses: mxschmitt/action-tmate@v3
